<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Card for Chagii</title>
  <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'DungGeunMo', monospace; }
    body {
      margin: 0; padding: 10px; min-height: 100vh;
      background-color: #ffb6c1;
      background-image: radial-gradient(#ff69b4 15%, transparent 16%), radial-gradient(#ff69b4 15%, transparent 16%);
      background-size: 60px 60px; background-position: 0 0, 30px 30px;
      display: flex; justify-content: center; align-items: center; overflow-x: hidden;
    }
    .card {
      background: rgba(255, 240, 245, 0.95); border: 4px solid #ff2a6d; border-radius: 20px;
      padding: 20px; text-align: center; width: 100%; max-width: 360px; box-shadow: 0 10px 0 #d61c57;
      position: relative; z-index: 10; margin: auto;
    }
    .pixel-frame {
      border: 5px solid #ff2a6d; border-radius: 16px; background: #fff;
      padding: 8px; margin-bottom: 12px; box-shadow: inset 0 0 0 2px #ff85a2;
      display: flex; justify-content: center; align-items: center; min-height: 160px;
    }
    .pixel-frame svg, .pixel-frame img { width: 100%; height: 160px; object-fit: contain; border-radius: 8px; }
    p { color: #ff2a6d; font-size: 1.1rem; margin: 10px 0; text-shadow: 1px 1px 0px #fff; line-height: 1.4; }
    .btn-container { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; position: relative; }
    .btn-row { display: flex; justify-content: center; align-items: center; gap: 15px; width: 100%; }
    .btn-yes {
      background: #ff2a6d; color: white; border: 3px solid #fff; padding: 10px 24px;
      font-size: 1.5rem; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 0 #b3003b;
      transition: all 0.2s ease; z-index: 999;
    }
    .btn-no {
      background: #888; color: white; border: 3px solid #fff; padding: 8px 16px;
      font-size: 1rem; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 0 #555;
    }
    .plead-text { color: #d61c57; font-size: 0.95rem; font-weight: bold; min-height: 24px; margin-bottom: 5px; }
    .option-btn {
      background: #fff; color: #ff2a6d; border: 2px solid #ff2a6d; padding: 8px;
      margin: 5px 0; border-radius: 8px; width: 100%; cursor: pointer; font-size: 0.95rem; text-align: left;
    }
    .option-btn.selected { background: #ff2a6d; color: #fff; font-weight: bold; }
    input[type="date"] { padding: 8px; border: 3px solid #ff2a6d; border-radius: 8px; font-size: 1rem; margin-bottom: 8px; width: 100%; text-align: center; }
    .hidden { display: none !important; }
    .window-box { background: #fff; border: 3px solid #ff2a6d; border-radius: 8px; padding: 14px; text-align: left; }
    .window-header { background: #ff2a6d; color: #fff; padding: 4px 8px; font-size: 0.9rem; margin: -14px -14px 12px -14px; border-radius: 4px 4px 0 0; }
    
    .grid-box {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; padding: 6px;
      background: #ffe6ed; border-radius: 10px; border: 2px dashed #ff2a6d;
    }
    .grid-box div {
      background: #fff; border-radius: 6px; height: 75px; display: flex;
      justify-content: center; align-items: center; font-size: 2rem; border: 1px solid #ff85a2;
    }

    .warning-box {
      background: #fff0f5; border: 2px dashed #ff2a6d; padding: 10px; border-radius: 8px;
      margin-top: 12px; color: #d61c57; font-size: 0.9rem; font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- STEP 0: HP 診断 (クロミ風ピクセルイラスト) -->
  <div id="step0" class="card">
    <div class="pixel-frame">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect width="100" height="100" fill="#fff"/>
        <!-- クロミ風頭巾 -->
        <path d="M 20 50 Q 20 20 50 20 Q 80 20 80 50 Z" fill="#333"/>
        <circle cx="25" cy="20" r="10" fill="#333"/>
        <circle cx="75" cy="20" r="10" fill="#333"/>
        <polygon points="50,25 45,35 55,35" fill="#ff69b4"/>
        <!-- 顔 -->
        <ellipse cx="50" cy="55" rx="25" ry="20" fill="#fff0f5"/>
        <ellipse cx="40" cy="52" rx="3" ry="5" fill="#333"/>
        <ellipse cx="60" cy="52" rx="3" ry="5" fill="#333"/>
        <path d="M 45 60 Q 50 65 55 60" stroke="#ff2a6d" stroke-width="2" fill="none"/>
        <circle cx="33" cy="58" r="4" fill="#ffb6c1"/>
        <circle cx="67" cy="58" r="4" fill="#ffb6c1"/>
      </svg>
    </div>
    <p>⚡ 오늘 자기의 체력(HP) 상태는?</p>
    <button class="option-btn" onclick="selectHp(this, '100% (에너지 폭발! ⚡)')">🟩 100% (에너지 폭발! ⚡)</button>
    <button class="option-btn" onclick="selectHp(this, '50% (일&운동해서 약간 피곤 🫠)')">🟨 50% (일&운동해서 약간 피곤 🫠)</button>
    <button class="option-btn" onclick="selectHp(this, '10% (당장 맛있는 거 먹고 쉬고 싶음 🛌)')">🟥 10% (당장 맛있는 거 먹고 쉬고 싶음 🛌)</button>
    <button class="btn-yes" style="font-size:1.1rem; margin-top:10px; width:100%;" onclick="startQuestion()">진단 완료 & 다음으로!</button>
  </div>

  <!-- STEP 1: YES大暴走 & 泣きつき (キティちゃんピクセルイラスト) -->
  <div id="step1" class="card hidden">
    <div class="pixel-frame">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect width="100" height="100" fill="#fff"/>
        <!-- キティ風顔 -->
        <ellipse cx="50" cy="50" rx="35" ry="28" fill="#fff" stroke="#ff2a6d" stroke-width="3"/>
        <polygon points="20,30 25,10 40,25" fill="#fff" stroke="#ff2a6d" stroke-width="3"/>
        <polygon points="80,30 75,10 60,25" fill="#fff" stroke="#ff2a6d" stroke-width="3"/>
        <!-- リボン -->
        <circle cx="70" cy="25" r="7" fill="#ff2a6d"/>
        <circle cx="60" cy="22" r="6" fill="#ff2a6d"/>
        <circle cx="80" cy="28" r="6" fill="#ff2a6d"/>
        <!-- 目・鼻 -->
        <ellipse cx="38" cy="50" rx="3.5" ry="5" fill="#333"/>
        <ellipse cx="62" cy="50" rx="3.5" ry="5" fill="#333"/>
        <ellipse cx="50" cy="56" rx="4" ry="3" fill="#ffcc00"/>
        <!-- ひげ -->
        <line x1="15" y1="48" x2="28" y2="50" stroke="#333" stroke-width="2"/>
        <line x1="15" y1="56" x2="28" y2="56" stroke="#333" stroke-width="2"/>
        <line x1="72" y1="50" x2="85" y2="48" stroke="#333" stroke-width="2"/>
        <line x1="72" y1="56" x2="85" y2="56" stroke="#333" stroke-width="2"/>
      </svg>
    </div>
    <p id="question-text">저랑 데이트 하실래요? 💖</p>
    <div class="plead-text" id="pleadText"></div>
    <div class="btn-container">
      <div class="btn-row">
        <button id="yesBtn" class="btn-yes" onclick="nextStep(2)">YES!</button>
        <button id="noBtn" class="btn-no" onclick="growYes()">NO...</button>
      </div>
    </div>
  </div>

  <!-- STEP 2: 日付 & デート場所選び -->
  <div id="step2" class="card hidden">
    <div class="pixel-frame">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect width="100" height="100" fill="#fff"/>
        <path d="M 50 30 C 20 0, 0 40, 50 90 C 100 40, 80 0, 50 30 Z" fill="#ff2a6d"/>
        <text x="50" y="55" font-size="20" fill="#fff" text-anchor="middle">DATE</text>
      </svg>
    </div>
    <p>어디서 만날까요? ✨</p>
    <input type="date" id="datePicker"><br>
    
    <button class="option-btn" onclick="selectPlace(this, '맛있는 디너 코스 🍽️')">🍽️ 맛있는 디너 코스</button>
    <button class="option-btn" onclick="selectPlace(this, '예쁜 카페 투어 ☕')">☕ 예쁜 카페 투어</button>
    <button class="option-btn" onclick="selectPlace(this, '영화관 데이트 🍿')">🍿 영화관 데이트</button>
    <button class="option-btn" onclick="selectPlace(this, '자기랑 함께 지옥의 헬스 데이트 💪')">💪 자기랑 함께 지옥의 헬스 데이트</button>
    <button class="option-btn" onclick="selectPlace(this, '자기 DJ 옆에서 폭풍 응원 데이트 🎧')">🎧 자기 DJ 옆에서 폭풍 응원 데이트</button>
    
    <button class="btn-yes" style="font-size:1.2rem; margin-top:10px; width:100%;" onclick="nextStep(3)">계속하기</button>
  </div>

  <!-- STEP 3: 確定画面 -->
  <div id="step3" class="card hidden">
    <div class="pixel-frame">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <rect width="100" height="100" fill="#fff"/>
        <circle cx="50" cy="50" r="40" fill="#ffb6c1"/>
        <text x="50" y="60" font-size="35" text-anchor="middle">🎉</text>
      </svg>
    </div>
    <p style="font-size: 1.3rem;">데이트 확정! 🎉</p>
    <div style="background:#fff; border:2px solid #ff2a6d; border-radius:8px; padding:10px; margin-bottom:12px; color:#ff2a6d; text-align:left; font-size:0.95rem;">
      <div>⚡ 체력: <span id="selectedHp">100%</span></div>
      <div>📅 날짜: <span id="selectedDate"></span></div>
      <div>📍 코스: <span id="selectedPlace">맛있는 디너 코스 🍽️</span></div>
    </div>
    <button class="btn-yes" style="font-size:1.1rem; width:100%;" onclick="nextStep(4)">새 메시지 1개 ✉️</button>
  </div>

  <!-- STEP 4: ラブレター & ちいかわ＆アザラシ絵文字スタンプ大集合 -->
  <div id="step4" class="card hidden">
    <div class="window-box">
      <div class="window-header">love_note.txt</div>
      <div style="color:#333; line-height:1.6; font-size:0.95rem;">
우리 자기, 💖<br>
매일 일도 열심히 하고 DJ도 하고 운동까지 열심히 하는 거 보면 정말 대단하고 멋있어.<br><br>
너무 든든하고 항상 고마워요.<br>
너무 무리하지 말고, 맛있는 거 먹고 데이트하자!<br><br>
오늘도 너무 고생 많았어. 사랑해❤️
      </div>
    </div>

    <!-- 絶対に消えないキュートなスタンプグリッド -->
    <div class="grid-box">
      <div>🐱</div>
      <div>🦭</div>
      <div>💖</div>
      <div>🎀</div>
      <div>🎧</div>
      <div>💪</div>
    </div>

    <!-- スクショ警告 -->
    <div class="warning-box">
      ⚠️ [중요] 이 화면을 캡처해서 지금 바로 여자친구에게 전송하세요! 📸❤️
    </div>
  </div>

  <script>
    let yesScale = 1;
    let selectedHpVal = "100% (에너지 폭발! ⚡)";
    let selectedCourse = "맛있는 디너 코스 🍽️";
    let noCount = 0;

    const noTexts = [
      "NO...",
      "에... 진짜로? 😭",
      "거짓말이지? 다시 생각해봐! 🥺",
      "DJ 해서 피곤한 건 알지만!! 🎧",
      "근육 때문에 YES 버튼 안 보이는 거지?! 💪"
    ];

    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'grow') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.4, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'win') {
          const now = ctx.currentTime;
          osc.type = 'square';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
          osc.start();
          osc.stop(now + 0.5);
        }
      } catch(e) {}
    }

    function selectHp(btn, hp) {
      playSound('click');
      document.querySelectorAll('#step0 .option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedHpVal = hp;
    }

    function startQuestion() {
      playSound('click');
      nextStep(1);
    }

    function growYes() {
      playSound('grow');
      noCount++;
      yesScale += 0.4;
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const pleadText = document.getElementById('pleadText');
      
      yesBtn.style.transform = `scale(${yesScale})`;

      if (noCount < noTexts.length) {
        pleadText.innerText = noTexts[noCount];
      } else {
        pleadText.innerText = "무조건 YES!! 💖";
      }

      if (noCount >= 4) {
        document.getElementById('question-text').innerText = "YES밖에 선택할 수 없어요! 💕";
        noBtn.style.display = 'none';
      }
    }

    function selectPlace(btn, place) {
      playSound('click');
      document.querySelectorAll('#step2 .option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCourse = place;
    }

    function nextStep(step) {
      if(step === 4) {
        playSound('win');
      } else {
        playSound('click');
      }
      document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
      document.getElementById('step' + step).classList.remove('hidden');
      
      if(step === 3) {
        const val = document.getElementById('datePicker').value;
        document.getElementById('selectedHp').innerText = selectedHpVal;
        document.getElementById('selectedDate').innerText = val || "2026-08-15";
        document.getElementById('selectedPlace').innerText = selectedCourse;
      }
    }
  </script>
</body>
</html>
