<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Catch Me!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #e0f2fe;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #score-board {
      position: absolute;
      top: 25px;
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #334155;
      z-index: 10;
    }
    #basket {
      position: absolute;
      bottom: 30px;
      width: 80px;
      height: 60px;
      font-size: 50px;
      text-align: center;
      line-height: 60px;
      transform: translateX(-50%);
      cursor: pointer;
      user-select: none;
      z-index: 10;
    }
    .falling-item {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      transform: translateX(-50%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      border: 2px solid white;
    }
  </style>
</head>
<body>

<div id="score-board">Catches: <span id="score">0</span> / 15</div>
<div id="basket">🧺</div>

<script>
  let score = 0;
  const targetScore = 15;
  const basket = document.getElementById('basket');
  let basketX = window.innerWidth / 2;
  
  // カゴの初期位置
  basket.style.left = basketX + 'px';

  // タッチ・マウス操作でカゴを動かす
  function moveBasket(x) {
    basketX = Math.max(40, Math.min(window.innerWidth - 40, x));
    basket.style.left = basketX + 'px';
  }

  window.addEventListener('mousemove', (e) => moveBasket(e.clientX));
  window.addEventListener('touchmove', (e) => moveBasket(e.touches[0].clientX));

  // アイテムを降らせる
  function createItem() {
    if (score >= targetScore) return;

    const item = document.createElement('img');
    item.src = 'S__16064520.jpg'; // アップロードした写真のファイル名
    item.className = 'falling-item';
    
    let itemX = Math.random() * (window.innerWidth - 80) + 40;
    let itemY = -70;
    const speed = 3 + Math.random() * 3;

    item.style.left = itemX + 'px';
    item.style.top = itemY + 'px';
    document.body.appendChild(item);

    const fallInterval = setInterval(() => {
      itemY += speed;
      item.style.top = itemY + 'px';

      // キャッチ判定
      const basketRect = basket.getBoundingClientRect();
      if (
        itemY >= basketRect.top - 40 &&
        itemY <= basketRect.bottom &&
        Math.abs(itemX - basketX) < 45
      ) {
        score++;
        document.getElementById('score').innerText = score;
        clearInterval(fallInterval);
        item.remove();
        
        if (score === targetScore) {
          setTimeout(() => {
            alert('Happy Anniversary! 🎉❤');
          }, 100);
        }
      }

      // 画面下に消えた場合
      if (itemY > window.innerHeight + 70) {
        clearInterval(fallInterval);
        item.remove();
      }
    }, 1000 / 60);
  }

  // 1秒ごとに新しいアイテムを生成
  setInterval(createItem, 1000);
</script>
</body>
</html>
